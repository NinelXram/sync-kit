name: sync-notify
on:
  push:
    branches: [__DEFAULT_BRANCH__]
    paths:
      - 'sync/**'
permissions:
  contents: read
jobs:
  sync-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: node sync/scripts/sync.mjs notify --before ${{ github.event.before }} --after ${{ github.sha }}
