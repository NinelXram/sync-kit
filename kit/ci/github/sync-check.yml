name: sync-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate sync notes
        run: node sync/scripts/sync.mjs check
      - name: Contract check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node sync/scripts/sync.mjs contract-check --base "$BASE_SHA" --head HEAD
